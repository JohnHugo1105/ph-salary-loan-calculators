<div class="container">
  <app-page-header title="Guides &amp; articles" lede="Short, practical explainers to go with the calculators." />
  <div class="grid grid--3">
    @for (g of guides; track g.route) {
      <app-tool-card [item]="g" cta="Read" />
    }
  </div>

  <section class="section" aria-labelledby="tools-title">
    <h2 id="tools-title">Calculators</h2>
    <p class="section__lede">Put the numbers to work.</p>
    <div class="grid grid--3">
      @for (t of tools; track t.id) {
        <app-tool-card [item]="t" />
      }
    </div>
  </section>
</div>
