<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found • PH Calculators</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <style>
    /* Mirrors the app's design tokens so a real 404 still looks like the site. */
    :root { color-scheme: light dark; --bg: #f5f6f8; --surface: #fff; --border: #e0e5ec; --text: #0e1520; --text-2: #435063; --brand: #1b4dd6; --on-brand: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1017; --surface: #121923; --border: #243044; --text: #eaf0f8; --text-2: #aab6c8; --brand: #3b69ee; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.6; }
    main { width: min(30rem, 100%); padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    .mark { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; margin-bottom: 1.25rem; border-radius: .5rem; background: var(--brand); color: var(--on-brand); font-weight: 800; font-size: 1.25rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.875rem; line-height: 1.2; letter-spacing: -.02em; }
    p { margin: 0 0 1.5rem; color: var(--text-2); }
    a { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 1.25rem; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">₱</div>
    <h1>Page not found</h1>
    <p>That page does not exist or has moved. You can start again from the homepage and find the calculator you need.</p>
    <a href="/">Go to the calculators</a>
  </main>
</body>
</html>
